name: Tanstack Start Template CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps

      - name: Create .env file
        run: cp .env.example .env

      - name: Check formatting, linting and types
        run: bun run lint:check && bun run type:check && bun run format:check

      - name: Build
        run: bun run build && bun run build:docker

      - name: Run tests
        run: bun run test:unit && bun run test:e2e
